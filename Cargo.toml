[package]
name = "sacremoses-rs"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated drop-in classes for sacremoses (Moses tokenizer, detokenizer, punctuation normalizer)"
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
regex = "1.13.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
