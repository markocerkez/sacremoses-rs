[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "sacremoses-rs"
version = "0.1.0"
description = "Rust-accelerated drop-in classes for sacremoses (Moses tokenizer, detokenizer, punctuation normalizer)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["sacremoses"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
]

[tool.maturin]
python-source = "python"
module-name = "sacremoses_rs._core"
features = ["pyo3/extension-module"]
