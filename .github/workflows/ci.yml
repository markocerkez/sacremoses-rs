name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel and install
        shell: bash
        run: |
          python -m pip install maturin pytest "sacremoses>=0.2.0"
          maturin build --release -o dist
          python -m pip install --no-index --find-links dist sacremoses-rs
      - name: Unit tests
        run: python -m pytest tests/test_basic.py -q
      - name: Differential test against released sacremoses
        shell: bash
        run: |
          python -m pip download "sacremoses==0.2.0" --no-deps --no-binary :all: -d upstream
          mkdir upstream/src && tar xzf upstream/sacremoses-0.2.0.tar.gz -C upstream/src
          curl -fsSL https://norvig.com/big.txt -o big.txt || cp README.md big.txt
          python -I tests/diff_test.py upstream/src/sacremoses-0.2.0 big.txt 600 1500
